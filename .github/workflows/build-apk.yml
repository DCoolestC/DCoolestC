name: Build Debug APK

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The run number becomes the APK's versionCode, so each build is a
      # strictly newer version than the last and installs as an update.
      # Signing key is pinned in app/build.gradle.kts (see the comment there)
      # so the signature stays identical across runners.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace -PisokoVersionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: isokovibe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts require a signed-in GitHub session and expire
      # after 90 days. Also publish to a release so there's a plain,
      # permanent, one-click download link.
      - name: Publish debug APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: iSokoVibe debug build #${{ github.run_number }}
          body: |
            Automated debug build from commit ${{ github.sha }} on `${{ github.ref_name }}`.
            Version code ${{ github.run_number }}.

            Install straight over any previous iSokoVibe build — no need to
            uninstall first. Enable "install unknown apps" for your browser or
            file manager, or use `adb install -r app-debug.apk`.
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
